<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bairro da Vila Belmiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    
    <!-- Topbar Suspensa -->
    <header class="top-header">
        <div class="header-info">
            <span id="clima-widget">🌤️ --°C</span> &nbsp;|&nbsp; <span id="relogio-widget">--:--</span>
        </div>
        <div class="frase-linha">
            <span class="coroa">👑</span>
            <span class="onda-mar">entre os ecos do mar e da torcida.</span>
            <span class="peixe">🐟</span>
        </div>
    </header>

    <!-- Hero Section (Tela Cheia 100vh) -->
    <section class="hero-fullscreen">
        <video autoplay loop muted playsinline class="hero-video">
            <source src="static/video.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        
        <!-- Título Gigante Alternando no Centro -->
        <div class="giant-titles">
            <h1 class="title-1">Bairro da Vila Belmiro</h1>
            <h1 class="title-2">A Mística Vila do Rei</h1>
        </div>

        <a href="#explore" class="scroll-arrow">↓</a>
    </section>

    <!-- Barra de Controle e Ações (Pós-Rolagem) -->
    <section id="explore" class="control-bar">
        <div class="timer-container">
            <span class="timer-label">PRÓXIMO JOGO:</span>
            <span id="countdown">Calculando...</span>
        </div>
        <div class="action-links">
            <a href="#" id="btnWaze" class="btn btn-waze" target="_blank">🚗 Navegar Waze</a>
            <a href="#" id="btnWhats" class="btn btn-whats" target="_blank">💬 Avisar Vizinho</a>
        </div>
    </section>

    <!-- Filtros do Mapa -->
    <nav class="category-nav">
        <button class="cat-btn active-cat" data-target="todos">Mostrar Tudo</button>
        <button class="cat-btn" data-target="transporte">Transporte</button>
        <button class="cat-btn" data-target="comer">Comer & Beber</button>
        <button class="cat-btn" data-target="estacionamento">Estacionamentos</button>
    </nav>

    <!-- Mapa Amplo -->
    <section class="fullscreen-map">
        <div id="map"></div>
    </section>

    <footer class="site-footer">
        <p>Projeto acadêmico - Universidade Virtual do Estado de São Paulo (UNIVESP).</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
